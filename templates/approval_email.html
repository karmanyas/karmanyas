<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Approve LinkedIn Post</title>
  </head>
  <body>
    <h2>LinkedIn Post Approval</h2>
    <p><strong>Draft:</strong></p>
    <p>{{post_text}}</p>
    <p>
      <a href="{{approve_url}}">✅ Approve</a>
      &nbsp;|&nbsp;
      <a href="{{reject_url}}">❌ Reject</a>
    </p>
    <p>Token expires at: {{expires_at}}</p>
  </body>
</html>
